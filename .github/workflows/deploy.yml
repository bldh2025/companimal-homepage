name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 소개서 PDF를 만드는 데만 쓰이는 원본 이미지와 검토용 로고 시안,
      # 빌드 스크립트는 사이트가 한 번도 요청하지 않으면서 배포 용량의 대부분을 차지한다.
      - name: Drop files the site never serves
        run: |
          rm -f zerolabs_homepage_assets/logo-*.png
          rm -f zerolabs_homepage_assets/lockup_*.png
          # product-*.png와 trial-*.png는 HTML 제품소개서가 직접 요청하므로 보존한다.
          rm -rf scripts
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
